# Dev channel: every push to `dev` publishes a container image and points the
# separate manifest repository (mxkissnr/glp-dev-app) at it, so the
# maintainer can test unreleased code on a real Home Assistant instance
# without touching the app that users run.
#
# Why the manifest lives in another repository at all: Home Assistant shows
# every app listed in a repository's root to everyone who has added that
# repository. Putting a dev app next to the stable one here would offer it
# to all users. A separate repository keeps it invisible unless deliberately
# added.
#
# Why this workflow rewrites `version` over there: Home Assistant pulls
# `image:{version}` and only offers an update when `version` changes. A fixed
# tag like `:dev` would be pulled once and then never refreshed, so each build
# gets its own immutable tag and the manifest is bumped to match.
name: Build dev channel image

on:
  push:
    branches: [dev]
    # Documentation-only pushes to dev don't change the image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# A newer push to dev makes an in-flight build obsolete.
concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # amd64 only: the dev channel exists to test code on the maintainer's own
    # HAOS box, which is amd64. The release build (build.yaml) still covers
    # armv7/aarch64 for users -- arch-specific problems surface there. Kept as
    # a matrix so adding an architecture back is a two-line change, and so the
    # `arch:` list in glp-dev-app's config.yaml stays the only other place
    # that has to agree.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./gaggiuino-local-profiler
          platforms: ${{ matrix.platform }}
          push: true
          # Separate cache scope from the release build so a dev build can
          # never poison the cache the release build restores from.
          cache-from: type=gha,scope=dev-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.arch }}
          tags: |
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:dev-${{ github.run_number }}
            ghcr.io/mxkissnr/gaggiuino-local-profiler/${{ matrix.arch }}:dev
          labels: |
            org.opencontainers.image.title=GLP DEV — Gaggiuino Local Profiler (unstable)
            org.opencontainers.image.description=Unstable dev build of GLP — maintainer testing only
            org.opencontainers.image.source=https://github.com/mxkissnr/gaggiuino-local-profiler
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev-${{ github.run_number }}
            org.opencontainers.image.licenses=MIT
            io.hass.version=dev-${{ github.run_number }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.name=GLP DEV — Gaggiuino Local Profiler (unstable)

  # Only after every architecture is published -- pointing the manifest at a
  # tag that exists for just one arch would break the app on the others.
  publish-manifest:
    name: Point dev manifest at the new build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev manifest repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: mxkissnr/glp-dev-app
          # GITHUB_TOKEN is scoped to this repository only, so writing to the
          # manifest repository needs a PAT with `contents: write` on it.
          token: ${{ secrets.DEV_ADDON_REPO_TOKEN }}

      - name: Bump version to the tag just built
        # Passed via env rather than interpolated into the script: run_number
        # is GitHub-generated and safe, but keeping every workflow input out
        # of the shell body means no future edit here can become an injection.
        env:
          NEW_VERSION: dev-${{ github.run_number }}
        run: |
          set -euo pipefail
          CONFIG="gaggiuino_local_profiler_dev/config.yaml"
          # Anchored to the start of the line so the `version:` key is the only
          # possible match -- description text may contain the word too.
          sed -i "s|^version: .*|version: \"${NEW_VERSION}\"|" "$CONFIG"
          grep -q "^version: \"${NEW_VERSION}\"$" "$CONFIG" || {
            echo "::error::version rewrite did not apply -- refusing to commit"
            exit 1
          }
          # Already pointing at this build: `git commit` exits 1 on an empty
          # commit, which would fail the job for a state that is actually
          # correct. Happens whenever this job is re-run (e.g. after fixing
          # the PAT) or the manifest was bumped by hand in the meantime.
          if git diff --quiet -- "$CONFIG"; then
            echo "$CONFIG already points at ${NEW_VERSION} -- nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG"
          git commit -m "chore(dev): point dev app at ${NEW_VERSION} (${GITHUB_SHA::7})"
          git push
